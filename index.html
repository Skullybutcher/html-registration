<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple Registration Form</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f5f5f5;
      margin: 0;
      padding: 0;
    }
    .container {
      width: 90%;
      max-width: 500px;
      margin: 40px auto;
      background: #fff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 0 8px rgba(0,0,0,0.1);
    }
    h2 {
      text-align: center;
    }
    label {
      display: block;
      margin-top: 10px;
      font-weight: bold;
    }
    input, select {
      width: 100%;
      padding: 8px;
      margin-top: 5px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    button {
      margin-top: 15px;
      width: 100%;
      padding: 10px;
      background-color: #007bff;
      border: none;
      color: white;
      font-size: 16px;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover {
      background-color: #0056b3;
    }
    .message {
      text-align: center;
      margin-top: 10px;
      padding: 10px;
      border-radius: 4px;
      display: none;
    }
    .success {
      background-color: #d4edda;
      color: #155724;
    }
    .error {
      background-color: #f8d7da;
      color: #721c24;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>Registration Form</h2>
    <form id="registration-form">
      <label>Full Name:</label>
      <input type="text" id="name" >

      <label>Roll Number:</label>
      <input type="text" id="roll-number" >

      <label>College:</label>
      <input type="text" id="college" >

      <label>Branch:</label>
      <input type="text" id="branch" >

      <label>Email:</label>
      <input type="email" id="email" >

      <label>Mobile Number:</label>
      <input type="tel" id="mobile" >

      <label>Gender:</label>
      <select id="gender" >
        <option value="">Select Gender</option>
        <option>Male</option>
        <option>Female</option>
      </select>

      <label>Year of Study:</label>
      <select id="year" >
        <option value="">Select Year</option>
        <option>1st Year</option>
        <option>2nd Year</option>
        <option>3rd Year</option>
        <option>4th Year</option>
      </select>

      <button type="submit">Submit</button>
    </form>

    <div id="success-message" class="message success">Form submitted successfully!</div>
    <div id="error-message" class="message error">Please fill all fields correctly.</div>
  </div>

  <script>
    const form = document.getElementById('registration-form');
    const successMsg = document.getElementById('success-message');
    const errorMsg = document.getElementById('error-message');

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const fields = ['name', 'roll-number', 'college', 'branch', 'email', 'mobile', 'gender', 'year'];
      let valid = true;

      fields.forEach(id => {
        if (document.getElementById(id).value.trim() === '') valid = false;
      });

      if (valid) {
        successMsg.style.display = 'block';
        errorMsg.style.display = 'none';
        form.reset();
      } else {
        errorMsg.style.display = 'block';
        successMsg.style.display = 'none';
      }
    });
  </script>

</body>
</html>
